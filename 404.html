<style>
:root{--pine:#2C3B2F;--sand:#F3ECE0;--ochre:#8F5410;--granite:#1C1E1B;--rule:#D8CFBF;--stone:#66625A;
  --serif:'Newsreader', Georgia, 'Times New Roman', serif;--sans:'Hanken Grotesk', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--sand);color:var(--granite);font-family:var(--sans);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased}
header{border-bottom:1px solid var(--rule)}
.in{max-width:760px;margin:0 auto;padding:0 20px}
header .in{display:flex;align-items:center;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--pine);font-family:var(--serif);font-size:21px;font-weight:500}
.logo svg{width:38px;height:28px}
main{flex:1;display:flex;align-items:center}
h1{font-family:var(--serif);font-weight:500;color:var(--pine);font-size:clamp(38px,7vw,58px);line-height:1.08;margin:0 0 16px}
h1 em{color:var(--ochre)}
p{margin:0 0 14px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre);margin:0 0 12px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-block;font:inherit;font-weight:600;font-size:17px;text-decoration:none;border:2px solid var(--pine);border-radius:3px;padding:13px 22px;background:var(--pine);color:var(--sand)}
.btn:hover{background:var(--granite)}
.btn.alt{background:transparent;color:var(--pine)}
.btn.alt:hover{background:var(--pine);color:var(--sand)}
footer{background:var(--granite);color:#BDB6A9;font-size:14px;padding:24px 0}
footer a{color:#E6DECF}
@media (max-width:560px){.btn{width:100%;text-align:center}}
